name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Pages must be turned on by hand: Settings -> Pages -> Source: GitHub
      # Actions. It cannot be provisioned from here — configure-pages'
      # `enablement: true` calls the create-Pages-site API, which GITHUB_TOKEN
      # is not permitted to use ("Resource not accessible by integration")
      # even with `pages: write`. On the free plan the repo must also be
      # public. Until that's done, skip the deploy instead of failing every
      # push.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is not enabled for this repository, so the site was not deployed."
          echo "Enable it under Settings -> Pages -> Source: GitHub Actions."
          echo "On the free plan that requires the repository to be public."

      - run: npm ci
      # `build:web` compiles the static mobile web app and emits it to web-dist/.
      # Always built, even when Pages is unavailable, so a broken build still fails CI.
      - run: npm run build:web

      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-dist

    outputs:
      pages_ready: ${{ steps.pages.outcome }}

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
